name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  EXPORT_PRESET: Web
  BUILD_DIR: build/web

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Download Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          tpl_dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl_dir"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* "$tpl_dir/"

      - name: Add Godot to PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Write export preset
        run: |
          # export_presets.cfg is gitignored; generate a CI one.
          # thread_support=false: GitHub Pages cannot send COOP/COEP headers,
          # which threaded web builds require.
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="${EXPORT_PRESET}"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="${BUILD_DIR}/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import project
        run: godot --headless --import || true

      - name: Export Web
        run: |
          mkdir -p "$BUILD_DIR"
          godot --headless --export-release "${EXPORT_PRESET}" "${BUILD_DIR}/index.html"
          test -s "${BUILD_DIR}/index.html" || { echo "::error::Web export failed"; exit 1; }
          ls -lh "$BUILD_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
