name: Build Android App Bundle

# Push a tag like v1.2.3 -> signed .aab is built and attached to a GitHub Release.
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (e.g. 1.0.1)"
        required: true
        default: "0.0.0"
      version_code:
        description: "versionCode (integer, must increase for every Play upload)"
        required: true
        default: "1"

permissions:
  contents: write # needed to create the GitHub Release

env:
  GODOT_VERSION: 4.7.2
  PACKAGE_NAME: com.minesweeper.game # Play Store package id - cannot change after first upload
  APP_NAME: Mine Sweeper
  EXPORT_PRESET: Android
  AAB_NAME: MineSweeper

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        env:
          INPUT_NAME: ${{ github.event.inputs.version_name }}
          INPUT_CODE: ${{ github.event.inputs.version_code }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            name="$INPUT_NAME"
            code="$INPUT_CODE"
          else
            name="${GITHUB_REF_NAME#v}"            # v1.2.3-beta -> 1.2.3-beta
            core="${name%%-*}"                     # 1.2.3
            if ! [[ "$core" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR[.MINOR[.PATCH]]"; exit 1
            fi
            IFS='.' read -r major minor patch <<< "$core"
            # 10# forces base 10 so parts like "08" aren't read as octal
            code=$(( 10#${major:-0} * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0} ))
          fi
          if ! [[ "$name" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid versionName '$name'"; exit 1
          fi
          if ! [[ "$code" =~ ^[0-9]+$ ]] || [ "$code" -lt 1 ]; then
            echo "::error::Invalid versionCode '$code' derived from '$name'"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code"

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for v in KS_B64 KS_PASS KS_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

          tpl_dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tpl_dir"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpl"
          mv "$RUNNER_TEMP"/tpl/templates/* "$tpl_dir/"
          ls "$tpl_dir" | grep -i android

      - name: Configure Godot editor settings
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"
          # Godot 4.3+ names the file after major.minor, e.g. editor_settings-4.7.tres
          settings=~/.config/godot/editor_settings-$(echo "$GODOT_VERSION" | cut -d. -f1,2).tres
          mkdir -p ~/.config/godot
          cat > "$settings" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cat "$settings"

          # Godot's export check wants a debug keystore to exist even for release builds
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          # Fails early if the keystore or password secret is wrong
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$KS_PASS" > /dev/null

      - name: Write export preset
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # export_presets.cfg is gitignored; generate a CI one.
          # Signing credentials are NOT written here - Godot reads them from
          # GODOT_ANDROID_KEYSTORE_RELEASE_* env vars in the export step.
          cat > export_presets.cfg <<EOF
          [preset.0]

          name="${EXPORT_PRESET}"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/${AAB_NAME}.aab"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=1
          gradle_build/compress_native_libraries=false
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=${VERSION_CODE}
          version/name="${VERSION_NAME}"
          package/unique_name="${PACKAGE_NAME}"
          package/name="${APP_NAME}"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192="res://Asset/Icons/Icon.png"
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/custom_permissions=PackedStringArray()
          EOF
          cat export_presets.cfg

      - name: Import project
        run: godot --headless --import || true

      - name: Export signed AAB
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --install-android-build-template \
            --export-release "${EXPORT_PRESET}" "build/${AAB_NAME}.aab"
          test -s "build/${AAB_NAME}.aab" || { echo "::error::AAB was not produced"; exit 1; }

      - name: Verify signature
        run: |
          ls -lh build/
          # jarsigner exits 0 even for unsigned files, so check its output
          out=$(jarsigner -verify -verbose -certs "build/${AAB_NAME}.aab")
          echo "$out" | tail -5
          echo "$out" | grep -q "jar verified." || { echo "::error::AAB is not signed"; exit 1; }
          mv "build/${AAB_NAME}.aab" "build/${AAB_NAME}-${VERSION_NAME}.aab"
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}-${{ steps.version.outputs.name }}
          path: build/*.aab
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.aab
          generate_release_notes: true
