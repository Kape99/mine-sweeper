name: Build Android App Bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (e.g. 2)"
        required: true
        default: "1"
      version_string:
        description: "Android versionName (e.g. 1.0.1)"
        required: true
        default: "1.0"

env:
  GODOT_VERSION: 4.7.2
  APP_ID: com.yourdomain.minesweeper
  EXPORT_PRESET: Android
  BUILD_DIR: build
  ABB_NAME: MineSweeper

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version_code=${{ github.event.inputs.version_code }}" >> $GITHUB_OUTPUT
          echo "version_string=${{ github.event.inputs.version_string }}" >> $GITHUB_OUTPUT
          else
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "version_string=$version" >> $GITHUB_OUTPUT
          IFS='.' read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + ${patch:-0}))
          echo "version_code=$code" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          target: android-34
          build-tools: 34.0.0
          ndk: 27.0.12077973
          cmake: 3.22.1

      - name: Download Godot headless binary
        run: |
          mkdir -p godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip \
          -O godot/godot.zip
          unzip -q godot/godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Install Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            -O /tmp/export_templates.tpz
          cd ~/.local/share/godot/export_templates
          unzip -q /tmp/export_templates.tpz
          ls -la

      - name: Decode signing keystore
        run: |
          mkdir -p "${BUILD_DIR}"
          echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "${BUILD_DIR}/release.keystore"
          echo "KEYSTORE_PATH=${BUILD_DIR}/release.keystore" >> $GITHUB_ENV
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Generate export preset
        run: |
          mkdir -p "${BUILD_DIR}"
          echo "[preset \"${EXPORT_PRESET}\"]" > export_presets.cfg
          echo "name=\"${EXPORT_PRESET}\"" >> export_presets.cfg
          echo 'platform="Android"' >> export_presets.cfg
          echo 'preset/custom_template_debug=""' >> export_presets.cfg
          echo 'preset/custom_template_release=""' >> export_presets.cfg
          echo "preset/application_id=\"${APP_ID}\"" >> export_presets.cfg
          echo 'preset/icon="res://Asset/Icons/Icon.png"' >> export_presets.cfg
          echo "preset/version_code=${VERSION_CODE}" >> export_presets.cfg
          echo "preset/version_string=\"${VERSION_STRING}\"" >> export_presets.cfg
          echo 'preset/one_click_deploy=false' >> export_presets.cfg
          echo 'preset/architectures=PackedStringArray("arm64-v8a", "armeabi-v7a")' >> export_presets.cfg
          echo 'preset/x86_64=false' >> export_presets.cfg
          echo 'preset/x86=false' >> export_presets.cfg
          echo 'preset/armv7=true' >> export_presets.cfg
          echo 'preset/arm64_v8a=true' >> export_presets.cfg
          echo 'preset/byteswap=false' >> export_presets.cfg
          echo "preset/keystore=\"${KEYSTORE_PATH}\"" >> export_presets.cfg
          echo "preset/keystore_pass=\"${ANDROID_KEYSTORE_PASSWORD}\"" >> export_presets.cfg
          echo "preset/key=\"${ANDROID_KEY_ALIAS}\"" >> export_presets.cfg
          echo "preset/key_pass=\"${ANDROID_KEY_PASSWORD}\"" >> export_presets.cfg
          echo 'preset/export_mode="file"' >> export_presets.cfg
          echo 'preset/build_tools_version="34.0.0"' >> export_presets.cfg
          echo 'preset/sdk_build_tools_version="34.0.0"' >> export_presets.cfg
          cat export_presets.cfg
        env:
          EXPORT_PRESET: ${{ env.EXPORT_PRESET }}
          APP_ID: ${{ env.APP_ID }}
          VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          VERSION_STRING: ${{ steps.vars.outputs.version_string }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_DIR: ${{ env.BUILD_DIR }}

      - name: Export Android App Bundle
        run: |
          ./godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
          --headless \
          --export-release "${EXPORT_PRESET}" \
          "${BUILD_DIR}/${ABB_NAME}.aab"
        env:
          EXPORT_PRESET: ${{ env.EXPORT_PRESET }}
          BUILD_DIR: ${{ env.BUILD_DIR }}
          ABB_NAME: ${{ env.ABB_NAME }}
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Verify ABB
        run: |
          ls -lh "${BUILD_DIR}/${ABB_NAME}.aab"
          file "${BUILD_DIR}/${ABB_NAME}.aab"
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}
          ABB_NAME: ${{ env.ABB_NAME }}

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: ${{ env.BUILD_DIR }}/${{ env.ABB_NAME }}.aab
          retention-days: 30
