name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"
  PROJECT_NAME: "minesweeper"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK and export templates
        run: |
          # Export templates are pre-installed in barichello/godot-ci
          # Setup Android SDK
          mkdir -p /root/.config/godot
          # Create editor settings with Android SDK path
          cat > /root/.config/godot/editor_settings-4.tres << 'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = ""
          EOF

      - name: Setup debug keystore
        run: |
          mkdir -p /root/.android
          keytool -genkey -v \
            -keystore /root/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>/dev/null || true

      - name: Import project
        run: |
          mkdir -p build
          godot --headless --import 2>&1 || true

      - name: Build APK
        run: |
          godot --headless --export-debug "Android" build/${PROJECT_NAME}.apk 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-apk
          path: build/${{ env.PROJECT_NAME }}.apk
          retention-days: 14

