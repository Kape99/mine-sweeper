repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Scony/godot-gdscript-toolkit.git
    rev: 4.1.0
    hooks:
      - id: gdformat
        args: [ --line-length, "120" ]
